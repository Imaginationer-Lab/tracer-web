name: tracer-web

# docker compose up -d --build
#
# 백엔드(tracer-backend) compose 가 먼저 떠 있어야 한다. 백엔드 네트워크에 붙어서 /api 를 api:3000 으로 넘긴다.
# 공개 주소 https://hackathon.kangdora.me 는 Cloudflare 를 거쳐 이 서버의 localhost:9000 으로 들어온다.

services:
  web:
    build: .
    ports:
      # 백엔드처럼 127.0.0.1 에만 연다. 밖에서는 Cloudflare 를 거쳐서만 들어온다
      - "127.0.0.1:${WEB_HOST_PORT:-9000}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:3000}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://hackathon.kangdora.me}
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    # tracer-backend compose(name: outage-map)의 기본 네트워크
    name: ${BACKEND_NETWORK:-outage-map_default}
    external: true
